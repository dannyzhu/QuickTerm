name: QuickTerm
options:
  bundleIdPrefix: dev.danny
  deploymentTarget:
    macOS: "15.4"
settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "15.4"
    # xcodegen 2.46 起默认打开脚本沙盒；「Bundle Ghostty Resources」要 rm/cp 到产物目录，沙盒下直接被拒
    ENABLE_USER_SCRIPT_SANDBOXING: false
targets:
  QuickTerm:
    type: application
    platform: macOS
    sources:
      - Sources
      - path: Themes
        type: folder
        buildPhase: resources
      - path: Resources
        buildPhase: resources
    dependencies:
      - framework: vendor/ghostty/macos/GhosttyKit.xcframework
        embed: false
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: Carbon.framework
      - sdk: CoreText.framework
      - sdk: UniformTypeIdentifiers.framework
    info:
      path: Sources/App/Info.plist
      properties:
        CFBundleDisplayName: QuickTerm
        CFBundleIconFile: AppIcon
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSPrincipalClass: NSApplication
        NSHumanReadableCopyright: "MIT"
        # 浏览器 pane：允许 http:// 明文页面（本地开发服务器 / 内网）
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
    settings:
      base:
        # 版本号唯一来源（scripts/make-release.sh 从构建产物的 Info.plist 读取）
        MARKETING_VERSION: "1.5.4"
        CURRENT_PROJECT_VERSION: "10"
        OTHER_LDFLAGS: "-lc++"
        PRODUCT_BUNDLE_IDENTIFIER: dev.danny.quickterm
        ENABLE_HARDENED_RUNTIME: false
        CODE_SIGN_IDENTITY: "-"
    postBuildScripts:
      - name: Bundle Ghostty Resources
        script: |
          RES_SRC="$SRCROOT/vendor/ghostty/zig-out/share/ghostty"
          RES_DST="$BUILT_PRODUCTS_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/ghostty"
          rm -rf "$RES_DST"; mkdir -p "$RES_DST"
          cp -R "$RES_SRC/" "$RES_DST/"
          TI_SRC="$SRCROOT/vendor/ghostty/zig-out/share/terminfo"
          TI_DST="$BUILT_PRODUCTS_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/terminfo"
          rm -rf "$TI_DST"; mkdir -p "$TI_DST"
          cp -R "$TI_SRC/" "$TI_DST/"
        basedOnDependencyAnalysis: false
  QuickTermTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
    dependencies:
      - target: QuickTerm
      - framework: vendor/ghostty/macos/GhosttyKit.xcframework
        embed: false
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: Carbon.framework
      - sdk: CoreText.framework
    settings:
      base:
        OTHER_LDFLAGS: "-lc++"
        GENERATE_INFOPLIST_FILE: true
        CODE_SIGN_IDENTITY: "-"
