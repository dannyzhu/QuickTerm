name: QuickTerm
options:
  bundleIdPrefix: dev.danny
  deploymentTarget:
    macOS: "15.4"
settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "15.4"
    # 版本号唯一来源（app 与 quickterm CLI 共用；scripts/make-release.sh 从构建产物的 Info.plist 读取）
    MARKETING_VERSION: "1.5.9"
    CURRENT_PROJECT_VERSION: "15"
    # xcodegen 2.46 起默认打开脚本沙盒；「Bundle Ghostty Resources」要 rm/cp 到产物目录，沙盒下直接被拒
    ENABLE_USER_SCRIPT_SANDBOXING: false
targets:
  QuickTerm:
    type: application
    platform: macOS
    sources:
      - Sources
      - path: Themes
        type: folder
        buildPhase: resources
      - path: Resources
        buildPhase: resources
    dependencies:
      - framework: vendor/ghostty/macos/GhosttyKit.xcframework
        embed: false
      # quickterm 控制面 CLI：随 app 构建，拷进 QuickTerm.app/Contents/SharedSupport/quickterm。
      # **不能**放 Contents/MacOS：APFS 默认大小写不敏感，`quickterm` 会直接覆盖掉
      # app 自己的主可执行文件 `QuickTerm`（症状是测试宿主起不来、dyld 找不到 QuickTerm.debug.dylib）
      - target: quickterm-cli
        copy:
          destination: sharedSupport
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: Carbon.framework
      - sdk: CoreText.framework
      - sdk: UniformTypeIdentifiers.framework
    info:
      path: Sources/App/Info.plist
      properties:
        CFBundleDisplayName: QuickTerm
        CFBundleIconFile: AppIcon
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSPrincipalClass: NSApplication
        NSHumanReadableCopyright: "MIT"
        # TCC（隐私）：终端 pane 会 chdir 到用户存档里的目录，其中三个是受保护目录。
        # 有了这几条系统才可能弹授权窗；没有的话请求会被静默处理（见 WorkingDirectoryGate）。
        # 注意：ad-hoc 签名（CODE_SIGN_IDENTITY "-"）下授权按 cdhash 绑定，每次重新构建都作废——
        # 真正治本的是换成稳定的签名身份，见 docs/manual-launch-check.md
        NSDesktopFolderUsageDescription: "QuickTerm needs access to your Desktop so it can reopen terminal panes in the directory you were last working in."
        NSDocumentsFolderUsageDescription: "QuickTerm needs access to your Documents folder so it can reopen terminal panes in the directory you were last working in."
        NSDownloadsFolderUsageDescription: "QuickTerm needs access to your Downloads folder so it can reopen terminal panes in the directory you were last working in."
        # 浏览器 pane：允许 http:// 明文页面（本地开发服务器 / 内网）
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
    settings:
      base:
        OTHER_LDFLAGS: "-lc++"
        PRODUCT_BUNDLE_IDENTIFIER: dev.danny.quickterm
        ENABLE_HARDENED_RUNTIME: false
        CODE_SIGN_IDENTITY: "-"
    preBuildScripts:
      # The UI catalog (Resources/*.lproj) is linted against the call sites on every build.
      # LocalizationTests asserts the same invariants, but it can only read the source tree once
      # the macOS Documents prompt is answered — ad-hoc signing rebinds that grant on every
      # rebuild, so in this repo (it lives under ~/Documents) those cases skip. A build script
      # runs as the developer's own shell and has that access, so the check runs for everybody.
      - name: Check Localization Catalog
        script: |
          if ! command -v python3 >/dev/null 2>&1; then
            echo "warning: python3 not found — skipping the localization catalog check"
            exit 0
          fi
          python3 "$SRCROOT/scripts/check-localization.py"
        basedOnDependencyAnalysis: false
    postBuildScripts:
      - name: Bundle Ghostty Resources
        script: |
          RES_SRC="$SRCROOT/vendor/ghostty/zig-out/share/ghostty"
          RES_DST="$BUILT_PRODUCTS_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/ghostty"
          rm -rf "$RES_DST"; mkdir -p "$RES_DST"
          cp -R "$RES_SRC/" "$RES_DST/"
          TI_SRC="$SRCROOT/vendor/ghostty/zig-out/share/terminfo"
          TI_DST="$BUILT_PRODUCTS_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/terminfo"
          rm -rf "$TI_DST"; mkdir -p "$TI_DST"
          cp -R "$TI_SRC/" "$TI_DST/"
        basedOnDependencyAnalysis: false
  # 控制面 CLI：纯 Foundation，**不依赖 GhosttyKit / AppKit**（否则就不是个毫秒级启动的小工具了）。
  # 线材（Sources/Control/Wire）与 WMAction 两个 target 共用同一份源码：命令表只有一处，不可能漂移。
  quickterm-cli:
    type: tool
    platform: macOS
    sources:
      - CLI
      - Sources/Control/Wire
      - Sources/Config/WMAction.swift
      # 配置注册表：`quickterm mcp` 要在 app 之外读到 `[control] mcp`。
      # 纯 Foundation，与 app 共用同一份声明（两份必然漂移）
      - Sources/Config/ConfigSchema.swift
    settings:
      base:
        PRODUCT_NAME: quickterm
        # 模块名必须与 app target 的 `QuickTerm` 区分开：macOS 文件系统大小写不敏感，
        # 产物目录里同时出现 quickterm.swiftmodule 与 QuickTerm.swiftmodule 会让
        # 测试里的 `@testable import QuickTerm` 加载到错的那一个
        PRODUCT_MODULE_NAME: QuickTermCLI
        PRODUCT_BUNDLE_IDENTIFIER: dev.danny.quickterm.cli
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: false
        # 版本号写进二进制的 __TEXT,__info_plist —— `quickterm version` 读它
        GENERATE_INFOPLIST_FILE: true
        CREATE_INFOPLIST_SECTION_IN_BINARY: true
        SKIP_INSTALL: true

  QuickTermTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
      # The two READMEs ride along as test resources. testEveryKeyIsDocumented has to read them,
      # and the test host cannot: it is ad-hoc signed and the repo lives under ~/Documents, which
      # macOS gates behind a privacy prompt nobody is there to answer on a build machine. Copying
      # them at build time keeps the assertion honest (the copy is regenerated on every build)
      # without asking the runtime for access it will not get.
      - path: README.md
        buildPhase: resources
      - path: README.zh-CN.md
        buildPhase: resources
    dependencies:
      - target: QuickTerm
      - framework: vendor/ghostty/macos/GhosttyKit.xcframework
        embed: false
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: Carbon.framework
      - sdk: CoreText.framework
    settings:
      base:
        OTHER_LDFLAGS: "-lc++"
        GENERATE_INFOPLIST_FILE: true
        CODE_SIGN_IDENTITY: "-"
