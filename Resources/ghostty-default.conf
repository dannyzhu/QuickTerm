# QuickTerm 内置的 ghostty 引擎兜底配置。
# 仅当用户没有自己的 ghostty 配置（~/.config/ghostty/config 或
# ~/Library/Application Support/com.mitchellh.ghostty/config）时加载；
# 一旦用户文件存在，本文件整体让位。QuickTerm 的主题/透明度/内边距覆盖层
# 与 config.toml 的 [ghostty] 段仍在其后加载（优先级更高）。
#
# 相对原始 Ghostty 配置的两处删减（QuickTerm 语义所需）：
# - 不设 shell-integration = none：新 pane 继承当前目录、状态恢复 cwd、
#   Cmd+W 免确认关闭空闲 shell 都依赖 shell 集成（OSC 7/133），保持引擎默认 detect。
# - 不设 keybind cmd+left/right = previous_tab/next_tab：QuickTerm 没有 tab，
#   Cmd+方向 是 WM 焦点导航键；写了只会覆盖引擎默认的行首/行尾变成死键。
#
# Config generated by Ghostty Config

font-family = Monaco
#font-family = JetBrains Mono
#font-family = Fire Code

font-size = 15
background-opacity = 0.92

term = xterm-256color

theme = Builtin Pastel Dark

clipboard-write = allow

scrollback-limit = 100000000
copy-on-select = clipboard
mouse-hide-while-typing = true
font-thicken = true

macos-option-as-alt = true
macos-window-shadow = true
macos-auto-secure-input = true

window-vsync = true
minimum-contrast = 1.2

macos-titlebar-style = tabs
macos-option-as-alt = true
window-save-state = always

confirm-close-surface = true
window-decoration = true
window-theme = auto
