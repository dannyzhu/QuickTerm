# QuickTerm agent rules — Codex.
id = "codex"
name = "Codex"
process = ["codex"]

[fields]
session = "$.session_id"
message = "$.message"
tool    = "$.tool_name"
summary = ["$.tool_input.command", "$.message"]

[hooks]
SessionStart      = "idle"
UserPromptSubmit  = "working:thinking"
PreToolUse        = "working:tool"
PostToolUse       = "working:thinking"
PermissionRequest = "blocked:approval"
Stop              = "done"
Interrupt         = "idle"
SessionEnd        = "released"

# [notifications] is deliberately empty: Codex's OSC wording is not in the spec and is not guessed.
# Record it from a real session and add the prefixes here — a rule-file change, nothing else.

[install]
shape     = "codex"
config    = "~/.codex/hooks.json"
lifecycle = ["SessionStart", "SessionEnd", "UserPromptSubmit", "PermissionRequest", "Stop", "Interrupt"]
tools     = ["PreToolUse", "PostToolUse"]

# Session restore: how to start this agent again in a pane after a relaunch. Argument arrays, each
# element one word; {session} is the hook-reported session id, checked before it is used.
[resume]
session = ["codex", "resume", "{session}"]
latest  = ["codex", "resume", "--last"]
